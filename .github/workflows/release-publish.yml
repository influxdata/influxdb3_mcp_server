name: Release publish

on:
  release:
    types: [published]

jobs:
  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Verify release tag and all package versions match
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: node scripts/check-versions.js

      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            npm publish --tag prerelease
          else
            npm publish
          fi

  mcp-registry-publish:
    name: Publish to MCP Registry
    timeout-minutes: 30
    needs: npm-publish
    if: >-
      github.repository == 'influxdata/influxdb3_mcp_server' &&
      !github.event.release.prerelease &&
      !contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: bash scripts/install-mcp-publisher.sh "$RUNNER_TEMP/mcp-publisher"

      - name: Validate MCP Registry metadata
        run: '"$RUNNER_TEMP/mcp-publisher" validate'

      - name: Wait for the npm version to become public
        run: bash scripts/wait-for-npm-package.sh

      - name: Authenticate to MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      - name: Publish to MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" publish'

      - name: Verify published server version
        run: |
          version="$(jq -r '.version' server.json)"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.influxdata%2Finfluxdb3-mcp-server/versions/$version" \
            --output "$RUNNER_TEMP/mcp-registry-server.json"
          jq --exit-status --arg version "$version" \
            '.server.name == "io.github.influxdata/influxdb3-mcp-server" and .server.version == $version' \
            "$RUNNER_TEMP/mcp-registry-server.json"

  docker-publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    environment: docker-publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tags="influxdata/influxdb3-mcp-server:$version"
          if [[ "$version" != *-* ]]; then
            tags="$tags"$'\n'"influxdata/influxdb3-mcp-server:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
