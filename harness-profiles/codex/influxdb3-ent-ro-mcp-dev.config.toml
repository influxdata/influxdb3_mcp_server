# Copy this file to ~/.codex/influxdb3-ent-ro-mcp-dev.config.toml.
# Export INFLUX_DB_TOKEN in the parent shell. Do not store token values here.

model_reasoning_effort = "low"
sandbox_mode = "read-only"
approval_policy = "never"

[mcp_servers.influxdb3_ent_ro_mcp_dev]
enabled = false
command = "docker"
args = [
  "run",
  "--rm",
  "-i",
  "--add-host=host.docker.internal:host-gateway",
  "-e", "INFLUX_DB_INSTANCE_URL",
  "-e", "INFLUX_DB_TOKEN",
  "-e", "INFLUX_DB_PRODUCT_TYPE",
  "-e", "INFLUX_MCP_TOOL_PROFILE",
  "-e", "MCP_LOG_TOOL_CALLS",
  "-e", "MCP_LOG_BACKEND",
  "-e", "MCP_LOG_FILE",
  "influxdb-mcp-server"
]
env_vars = ["INFLUX_DB_TOKEN"]
default_tools_approval_mode = "approve"

[mcp_servers.influxdb3_ent_ro_mcp_dev.env]
INFLUX_DB_INSTANCE_URL = "http://host.docker.internal:8181/"
INFLUX_DB_PRODUCT_TYPE = "enterprise"
INFLUX_MCP_TOOL_PROFILE = "readonly"
MCP_LOG_TOOL_CALLS = "true"
